_schema-version: 3.3.0
ID: budget-cockpit
version: 1.0.0
description: "Budget monitoring cockpit - SAP BTP extension for S/4HANA Finance (CO)"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - mkdir -p .deploy/app-router/resources/budgets
        - cp -r app/budgets/webapp/. .deploy/app-router/resources/budgets/
modules:
  - name: budget-cockpit-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: budget-cockpit-auth
      - name: budget-cockpit-db
      - name: budget-cockpit-destination

  - name: budget-cockpit-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: budget-cockpit-db
  - name: budget-cockpit
    type: approuter.nodejs
    path: .deploy/app-router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: budget-cockpit-auth
      - name: budget-cockpit-destination
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: budget-cockpit-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: budget-cockpit-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'BudgetController (budget-cockpit ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.BudgetController'
          - name: 'CostCenterOwner (budget-cockpit ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.CostCenterOwner'
    requires:
      - name: app-api
  - name: budget-cockpit-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: budget-cockpit-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
